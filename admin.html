
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRESH FISH | Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f3;color:#20352a}
header{background:#176b3a;color:white;padding:20px}
header h2{margin:0}
header p{margin:6px 0 0;font-size:13px}
main{max-width:850px;margin:auto;padding:15px}
.card{background:white;padding:17px;border-radius:13px;margin:13px 0;box-shadow:0 2px 10px #0000000c}
input,button,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:15px}
button{background:#176b3a;color:white;border:0;font-weight:bold}
button.secondary{background:#e8f2eb;color:#176b3a}
.small{font-size:13px;color:#66756b}
.hidden{display:none!important}
.order{border:1px solid #e1e9e2;border-radius:10px;padding:13px;margin:12px 0}
.order h3{margin:0 0 8px;color:#176b3a}
.status{font-weight:bold;color:#176b3a}
.message{overflow-wrap:anywhere}
</style>
</head>

<body>

<header>
<h2>🐟 FRESH FISH</h2>
<p>Admin Dashboard · Siliguri</p>
</header>

<main>

<section id="login" class="card">
<h3>Admin Login</h3>

<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="password" type="password" placeholder="Password" required>
<button id="loginButton" type="submit">LOGIN</button>
</form>

<p id="message" class="small message"></p>
</section>

<section id="dashboard" class="hidden">

<div class="card">
<h3>Welcome, Admin! 👋</h3>
<button class="secondary" id="refreshButton">🔄 REFRESH ORDERS</button>
<button id="logoutButton">LOG OUT</button>
<p id="orderMessage" class="small"></p>
</div>

<div class="card">
<h3>📦 Customer Orders</h3>
<div id="ordersList">
Loading orders...
</div>
</div>
<div class="card">
  <h3>🛒 Product Management</h3>

  <p class="small">Add a new product</p>

  <input id="productName" placeholder="Product name">
  <input id="productCategory" placeholder="Category (Fish/Chicken/Mutton/Eggs)">
  <input id="productPrice" type="number" placeholder="Price">
  <input id="productUnit" placeholder="Unit (kg/piece)" value="kg">
  <input id="productDescription" placeholder="Description">

  <button id="addProductButton">➕ ADD PRODUCT</button>

  <p id="productMessage" class="small"></p>
  <div id="productsList">Loading products...</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://sfrnncyajgiuksxrvkyk.supabase.co";
const SUPABASE_KEY = "sb_publishable_WYWEZSPU846BEZm5DpZ0ag_GuuZLECt";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById("login");
const dashboardSection = document.getElementById("dashboard");
const message = document.getElementById("message");
const orderMessage = document.getElementById("orderMessage");
const ordersList = document.getElementById("ordersList");

// CHECK ADMIN
async function checkAdmin(user) {
  const {data,error} = await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error) {
    console.error(error);
    return false;
  }

  return !!data;
}

// SHOW DASHBOARD
function showDashboard() {
  loginSection.classList.add("hidden");
  dashboardSection.classList.remove("hidden");
}

// SHOW LOGIN
function showLogin() {
  dashboardSection.classList.add("hidden");
  loginSection.classList.remove("hidden");
}

// LOGIN
document.getElementById("loginForm").addEventListener("submit",async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.textContent = "Logging in...";
  document.getElementById("loginButton").disabled = true;

  try {
    const {data,error} = await supabaseClient.auth.signInWithPassword({
      email,password
    });

    if(error) {
      message.textContent = "Login failed: " + error.message;
      return;
    }

    const authorised = await checkAdmin(data.user);

    if(!authorised) {
      await supabaseClient.auth.signOut();
      message.textContent = "You are not an authorised admin.";
      return;
    }

    message.textContent = "";
    showDashboard();
    await loadOrders();

  } catch(err) {
    message.textContent = "Error: " + err.message;
  } finally {
    document.getElementById("loginButton").disabled = false;
  }
});

// LOAD ORDERS
async function loadOrders() {
  ordersList.textContent = "Loading orders...";
  orderMessage.textContent = "";

  const {data,error} = await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false});

  if(error) {
    ordersList.textContent = "Could not load orders: " + error.message;
    console.error(error);
    return;
  }

  if(!data || data.length === 0) {
    ordersList.textContent = "No customer orders found yet.";
    return;
  }

  ordersList.replaceChildren();

  data.forEach(order => {
    const card = document.createElement("div");
    card.className = "order";

    const heading = document.createElement("h3");
    heading.textContent = "Order #" + order.id;

    const details = document.createElement("p");
    details.textContent =
      "Customer: " + (order.customer_name || "N/A") +
      "\nPhone: " + (order.phone || "N/A") +
      "\nAddress: " + (order.address || "N/A") +
      "\nTotal: ₹" + (order.total_amount ?? 0) +
      "\nPayment: " + (order.payment_method || "N/A") +
      "\nPayment Status: " + (order.payment_status || "pending") +
      "\nOrder Date: " + (order.created_at || "N/A");
    details.style.whiteSpace = "pre-line";

    const label = document.createElement("p");
    label.className = "status";
    label.textContent = "Order Status: " + (order.order_status || "pending");

    const select = document.createElement("select");

    ["pending","confirmed","processing","out_for_delivery","delivered","cancelled"].forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status.replaceAll("_"," ");
      if(status === (order.order_status || "pending")) {
        option.selected = true;
      }
      select.appendChild(option);
    });

    const updateButton = document.createElement("button");
    updateButton.textContent = "UPDATE ORDER STATUS";

    updateButton.addEventListener("click",async function() {
      updateButton.disabled = true;
      updateButton.textContent = "Updating...";

      const {error:updateError} = await supabaseClient
        .from("orders")
        .update({order_status:select.value})
        .eq("id",order.id);

      if(updateError) {
        alert("Update failed: " + updateError.message);
      } else {
        alert("Order status updated!");
        await loadOrders();
      }
    });

    card.append(heading,details,label,select,updateButton);
    ordersList.appendChild(card);
  });

  orderMessage.textContent = data.length + " order(s) found.";
}

// REFRESH
document.getElementById("refreshButton").addEventListener("click",loadOrders);

// LOGOUT
document.getElementById("logoutButton").addEventListener("click",async function() {
  const {error} = await supabaseClient.auth.signOut();

  if(error) {
    alert("Logout failed: " + error.message);
    return;
  }

  document.getElementById("password").value = "";
  showLogin();
});
// LOAD PRODUCTS
async function loadProducts() {
  const list = document.getElementById("productsList");
  const msg = document.getElementById("productMessage");

  list.textContent = "Loading products...";

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    list.textContent = "Error: " + error.message;
    return;
  }

  list.replaceChildren();

  data.forEach(product => {
    const card = document.createElement("div");
    card.className = "order";

    const name = document.createElement("h3");
    name.textContent = product.name;

    const info = document.createElement("p");
    info.textContent =
      product.category + " | ₹" + product.price +
      " / " + product.unit +
      " | " + (product.is_active ? "Active" : "Inactive");

    const price = document.createElement("input");
    price.type = "number";
    price.value = product.price;
    price.placeholder = "New price";

    const update = document.createElement("button");
    update.textContent = "UPDATE PRICE";

    update.addEventListener("click", async () => {
      const newPrice = Number(price.value);

      if (!Number.isFinite(newPrice) || newPrice <= 0) {
        alert("Enter a valid price");
        return;
      }

      const { error } = await supabaseClient
        .from("products")
        .update({ price: newPrice })
        .eq("id", product.id);

      if (error) {
        alert("Update failed: " + error.message);
      } else {
        alert("Price updated!");
        await loadProducts();
      }
    });

    card.append(name, info, price, update);
    list.appendChild(card);
  });

  msg.textContent = data.length + " product(s) found.";
}

// ADD PRODUCT
document.getElementById("addProductButton")
  .addEventListener("click", async () => {
    const name = document.getElementById("productName").value.trim();
    const category = document.getElementById("productCategory").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const unit = document.getElementById("productUnit").value.trim();
    const description = document.getElementById("productDescription").value.trim();
    const msg = document.getElementById("productMessage");

    if (!name || !category || !unit || !Number.isFinite(price) || price <= 0) {
      msg.textContent = "Please fill all required fields correctly.";
      return;
    }

    const { error } = await supabaseClient
      .from("products")
      .insert([{
        name,
        category,
        price,
        unit,
        description,
        is_active: true
      }]);

    if (error) {
      msg.textContent = "Error: " + error.message;
      return;
    }

    msg.textContent = "Product added successfully!";
    document.getElementById("productName").value = "";
    document.getElementById("productCategory").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productDescription").value = "";

    await loadProducts();
  });
// RESTORE SESSION
async function restoreSession() {
  const {data,error} = await supabaseClient.auth.getSession();

  if(error || !data.session) {
    showLogin();
    return;
  }

  const authorised = await checkAdmin(data.session.user);

  if(authorised) {
    showDashboard();
    await loadOrders();
  } else {
    await supabaseClient.auth.signOut();
    showLogin();
    message.textContent = "Not an authorised admin.";
  }
}

restoreSession();

</script>
</body>
</html>
